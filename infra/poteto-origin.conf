pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    map_hash_bucket_size 128;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 50m;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    map $host $poteto_upstream_host {
        default "";
        include /srv/poteto-origin/conf/apps.map;
    }
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:5m;
    ssl_certificate /etc/poteto-origin/tls/origin.pem;
    ssl_certificate_key /etc/poteto-origin/tls/origin.key;
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }
    server {
        listen 443 ssl;
        server_name poteto.iflink.tech;
        if ($host != $ssl_server_name) { return 421; }
        root /srv/poteto-origin/public;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        location = /install.ps1 { default_type text/plain; }
        location ~ (^|/)\. { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
    server {
        listen 443 ssl;
        server_name deploy.iflink.tech;
        if ($host != $ssl_server_name) { return 421; }
        # Application API enforces 50 MiB source and 128 MiB image limits.
        client_max_body_size 128m;
        location ^~ /internal/ { return 404; }
        location / {
            proxy_pass http://127.0.0.1:21080;
            proxy_set_header Host deploy.w33d.xyz;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
    server {
        listen 443 ssl;
        # Only hosts present in the authenticated apps.map can reach a project.
        server_name "*.page.iflink.tech";
        include /srv/poteto-origin/conf/page-tls/*.conf;
        if ($host != $ssl_server_name) { return 421; }
        if ($poteto_upstream_host = "") { return 404; }
        location / {
            proxy_pass http://127.0.0.1:21080;
            proxy_set_header Host $poteto_upstream_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
